name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r online_ai_music_repo_setup/requirements/dev.txt

      - name: Lint (ruff)
        working-directory: online_ai_music_repo_setup/apps/api
        run: python -m ruff check .

      - name: Run tests
        working-directory: online_ai_music_repo_setup/apps/api
        run: python -m pytest -q
