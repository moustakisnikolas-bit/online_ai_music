[project]
name = "aion-monorepo"
version = "0.1.0"
description = "AI Autonomous Content Operating System"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker"]
testpaths = ["apps/api/tests", "apps/worker/tests"]
# E2E tests need a real browser and a live dev server -- excluded from the
# default run (which stays fast and dependency-free); run explicitly with
# `pytest apps/api/tests/e2e/`.
norecursedirs = ["e2e"]

[tool.ruff]
line-length = 100
target-version = "py312"
