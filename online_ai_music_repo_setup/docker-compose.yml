services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aion
      POSTGRES_PASSWORD: aion
      POSTGRES_DB: aion
    ports:
      - "5432:5432"
    volumes:
      - aion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aion -d aion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Not currently used by the app -- everything writes to local disk
  # (data/generated/...) instead. Kept here, not wired in, since object
  # storage is legitimate future work for a real deployment (durability,
  # not exposing the whole server to serve files); the unused `minio`
  # Python package was removed from requirements.txt since that part was
  # genuinely dead, but standing this service down is a bigger call than a
  # quick fix, so it's left running and clearly labeled instead.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aion
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aion-minio:/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://aion:aion@postgres:5432/aion
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://aion:aion@postgres:5432/aion
      REDIS_URL: redis://redis:6379/0
      GENERATED_AUDIO_DIR: /app/data/generated/audio
      SOUNDFONT_PATH: /app/data/soundfonts/GeneralUser-GS.sf2
    ports:
      - "8000:8000"
    volumes:
      - ./data/generated:/app/data/generated
      # Drop the .sf2 file here on the host once (see
      # apps/api/data/soundfonts/README.md) -- not baked into the image,
      # so it doesn't need a rebuild to add/update.
      - ./data/soundfonts:/app/data/soundfonts
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aion:aion@postgres:5432/aion
      REDIS_URL: redis://redis:6379/0
      GENERATED_AUDIO_DIR: /app/data/generated/audio
    volumes:
      - ./data/generated:/app/data/generated
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Separate process from `worker` -- that one blocks on real audio-job
  # processing via Redis BRPOP and isn't a safe place to interleave the
  # album pipeline's hours-spanning harmony-check/render/upload pacing.
  album_worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["python", "/app/apps/worker/app/album_worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://aion:aion@postgres:5432/aion
      GENERATED_AUDIO_DIR: /app/data/generated/audio
      SOUNDFONT_PATH: /app/data/soundfonts/GeneralUser-GS.sf2
    volumes:
      - ./data/generated:/app/data/generated
      - ./data/soundfonts:/app/data/soundfonts
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  aion-postgres:
  aion-minio:
