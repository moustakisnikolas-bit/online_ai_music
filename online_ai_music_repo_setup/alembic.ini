[alembic]
script_location = database/migrations
prepend_sys_path = apps/api
# Placeholder only -- database/migrations/env.py overrides this at runtime
# with get_settings().database_url (the app's real .env-backed DB URL), so
# this static value can't drift out of sync with the real dev port again.
sqlalchemy.url = postgresql+psycopg://aion:aion@127.0.0.1:5435/aion

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
